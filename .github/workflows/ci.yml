name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  firmware-contract:
    name: Firmware contract (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gl-mt3000-4.8.1-release
            sha256: ee038ee0f399c1454cc660dd47811b44697f5304e0f61af145c7dca6817d0e5c
          - id: gl-axt1800-4.8.3-release1
            sha256: fdb284e1ac9886b7183b7a3bf1b2604603f757f41709d21949c0c4983e16ec5a
          - id: gl-sft1200-4.8.3-release4
            sha256: f84630b6b95f7558c0708672f739892b54acc3d78a4c92dae866faada9ff5e1f
          - id: gl-mt6000-4.9.1-release1
            sha256: 0342114922db0b5e98750a8414eeb23849ce1b8f30f85c46d6d11d69a070bcef
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          path: .cache/firmware
          key: gl-firmware-${{ matrix.id }}-${{ matrix.sha256 }}
      - run: sudo apt-get update
      - run: sudo apt-get install --yes squashfs-tools
      - run: node scripts/verify-firmware.js "${{ matrix.id }}" --download
